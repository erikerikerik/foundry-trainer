[package]
name = "foundry-spike"
version = "0.0.1"
edition.workspace = true
description = "Phase 0.5 numerical feasibility spike (temporary; not part of the shipped app)"
publish = false

[dependencies]
# Direct cudarc use (0.5.1 NVRTC spike). Features must match candle-core's cudarc request
# (dynamic-linking + cuda-version-from-build-system): cargo unifies them, and cudarc's
# build script panics on a dynamic-loading/dynamic-linking or two-version mix.
cudarc = { version = "=0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-linking"] }
# Spike path A (ARCHITECTURE.md): Candle tensors/autograd for the block forward.
candle-core = { version = "0.11", features = ["cuda"] }
# candle-nn's CUDA fast paths (layer-norm, softmax CustomOps) are gated on candle-nn's OWN
# cuda feature - candle-core's cuda feature does not turn them on; without it those ops
# error with "no cuda implementation".
candle-nn = { version = "0.11", features = ["cuda"] }
nvml-wrapper = "0.13.0"
